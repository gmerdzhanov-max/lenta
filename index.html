<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Лента</title>
<style>
:root{--bg:#14110f;--card:#1f1a17;--line:#332c27;--tx:#f2ece2;--mu:#a89d90;--brand:#e8b04a;--money:#6fb3a0;--photo:#d98a7a;--art:#9aa7e0}
@media (prefers-color-scheme:light){:root{--bg:#f6f1e8;--card:#fffdf8;--line:#e3d9c8;--tx:#221c17;--mu:#6c6256}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0;letter-spacing:.3px}
.upd{font-size:12px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--tx);padding:8px 14px;border-radius:999px;font-size:14px;min-height:40px}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(90px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.card img.cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.body{padding:14px 16px 12px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%}
.card h2{font-size:18px;line-height:1.3;margin:0 0 8px}
.bgs{margin:0 0 10px;font-size:15px}
.orig{margin:0 0 10px;font-size:13px;color:var(--mu)}
.act{display:flex;gap:8px;padding:0 12px 12px}
.btn{flex:1;min-height:44px;border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:12px;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.on{color:var(--brand);border-color:var(--brand)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button[aria-selected=true]{color:var(--tx)}
nav svg{width:22px;height:22px}
.empty{color:var(--mu);text-align:center;padding:40px 0}
.art .cover{aspect-ratio:4/3}
.yrs{color:var(--art);font-size:13px}
.art h3{margin:10px 0 2px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.art p{margin:0 0 6px;font-size:15px}
details summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--art);font-size:15px}
details summary::-webkit-details-marker{display:none}
.hide{display:none}
</style>
</head>
<body>
<header>
 <div class="top"><h1>Лента</h1><span class="upd" id="upd"></span></div>
 <div class="chips" id="chips" role="tablist"></div>
</header>
<main id="main"></main>
<nav>
 <button data-tab="news" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Новини</button>
 <button data-tab="art" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Изкуство</button>
 <button data-tab="saved" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Запазени</button>
</nav>
<script src="data/feed.js"></script>
<script src="art.js"></script>
<script>
const TOPICS={all:["Всички","#f2ece2"],brand:["Бранд и дизайн","var(--brand)"],money:["Пари и пазари","var(--money)"],photo:["Фотография","var(--photo)"]};
const $=s=>document.querySelector(s);
const feed=window.LENTA_FEED||[],art=window.LENTA_ART||[];
let tab='news',topic='all',onlyBg=false;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let saved=store.get('saved',[]),hidden=store.get('hidden',[]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(d){if(!d)return'';const m=(Date.now()-new Date(d))/6e4;if(m<60)return Math.max(1,Math.round(m))+' мин';if(m<1440)return Math.round(m/60)+' ч';return Math.round(m/1440)+' дни'}
function chips(){const c=$('#chips');c.innerHTML='';
 if(tab==='art'){c.innerHTML='<span class="upd">Картите се разгръщат с едно докосване</span>';return}
 Object.entries(TOPICS).forEach(([k,[n]])=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed',k===topic);b.onclick=()=>{topic=k;render()};c.appendChild(b)});
 const b=document.createElement('button');b.className='chip';b.textContent='Само с резюме';b.setAttribute('aria-pressed',onlyBg);b.onclick=()=>{onlyBg=!onlyBg;render()};c.appendChild(b)}
function newsCard(i){const col=TOPICS[i.topic][1],isS=saved.includes(i.id);
 return `<article class="card" data-id="${esc(i.id)}">${i.image?`<img class="cover" loading="lazy" src="${esc(i.image)}" alt="" onerror="this.remove()">`:''}
 <div class="body"><div class="meta"><span class="dot" style="background:${col}"></span>${esc(i.source)} · ${ago(i.date)}</div>
 <h2>${esc(i.title)}</h2>${i.bg?`<p class="bgs">${esc(i.bg)}</p>`:`<p class="orig">${esc(i.snippet.slice(0,160))}</p>`}</div>
 <div class="act"><a class="btn p" href="${esc(i.link)}" target="_blank" rel="noopener">Прочети</a><button class="btn ${isS?'on':''}" data-save>${isS?'Запазено':'Запази'}</button><button class="btn" data-hide>Скрий</button></div></article>`}
function artCard(a){return `<article class="card art"><img class="cover" data-wiki="${esc(a.wiki)}" alt="${esc(a.work)}" style="display:none">
 <div class="body"><div class="yrs">${esc(a.years)}</div><h2>${esc(a.period)}</h2><p class="orig">${esc(a.work)}</p>
 <details><summary>Защо, смисъл и архитектура</summary>
 <h3>Автори</h3><p>${esc(a.artists)}</p><h3>Защо се рисува така</h3><p>${esc(a.why)}</p><h3>Смисъл</h3><p>${esc(a.meaning)}</p><h3>Връзка с архитектурата</h3><p>${esc(a.arch)}</p></details></div></article>`}
async function loadImgs(){for(const im of document.querySelectorAll('img[data-wiki]')){
 try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+im.dataset.wiki);const j=await r.json();const u=j.originalimage?.source&&j.thumbnail?.source?j.thumbnail.source.replace(/\/\d+px-/,'/800px-'):j.thumbnail?.source;if(u){im.src=u;im.onload=()=>im.style.display='block'}}catch(e){}}}
function render(){chips();const m=$('#main');let h='';
 if(tab==='art'){h=art.map(artCard).join('')}
 else{let l=feed.filter(i=>!hidden.includes(i.id));
  if(tab==='saved')l=feed.filter(i=>saved.includes(i.id));else{if(topic!=='all')l=l.filter(i=>i.topic===topic);if(onlyBg)l=l.filter(i=>i.bg)}
  h=l.length?l.map(newsCard).join(''):`<div class="empty">${tab==='saved'?'Още нямаш запазени статии.':'Няма статии за този филтър.'}</div>`}
 m.innerHTML=h;if(tab==='art')loadImgs();window.scrollTo(0,0)}
$('#main').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const id=c.dataset.id;
 if(e.target.matches('[data-save]')){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];store.set('saved',saved);const on=saved.includes(id);e.target.textContent=on?'Запазено':'Запази';e.target.classList.toggle('on',on);if(tab==='saved'&&!on)render()}
 if(e.target.matches('[data-hide]')){hidden.push(id);store.set('hidden',hidden);c.remove()}});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
const newest=feed.map(i=>i.date).sort().pop();$('#upd').textContent=newest?'последна статия преди '+ago(newest):'';
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
