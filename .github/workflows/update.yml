name: Обновяване на новините
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-feeds.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "lenta-bot"
          git config user.email "lenta-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Нови статии" && git push)
